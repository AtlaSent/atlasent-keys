# keys.atlasent.io — static trust-root host (replaces nginx:alpine's stock
# /etc/nginx/conf.d/default.conf; everything not commented below is the stock
# behaviour, unchanged).
#
# CORS: every file here is public verification material (verifier keys,
# revocations, Sigstore identities, cosign.pub, signature bundles), served to
# anyone. Allowing any origin to READ it lets an in-browser verifier (AtlaSent
# Proof at verify.atlasent.io/verify/audit, or a customer's own page) fetch the
# trust root directly instead of asking the user to download it first. This
# grants nothing new: the same files are already readable by curl, and
# Allow-Credentials is never sent, so no cookie or auth ever rides along.
# Only GET/HEAD/OPTIONS are answered; the host has no write path.
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age       "86400" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age       "86400";
            return 204;
        }
        limit_except GET HEAD OPTIONS {
            deny all;
        }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
